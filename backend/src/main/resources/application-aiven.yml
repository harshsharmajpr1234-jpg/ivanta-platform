server:
  port: ${SERVER_PORT:8085}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:159.65.6.195}:${DB_PORT:18672}/${DB_NAME:defaultdb}?sslMode=REQUIRED&trustServerCertificate=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&autoReconnect=true
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: aiven-mysql-pool
      connection-test-query: SELECT 1
      keepalive-time: 30000
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Kolkata
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ivanta:
  security:
    bootstrap-admin-email: ${IVANTA_INITIAL_ADMIN_EMAIL:${ADMIN_ROOT_EMAIL:admin@flyphones.in}}
    bootstrap-admin-password: ${IVANTA_INITIAL_ADMIN_PASSWORD:${ADMIN_ROOT_PASSWORD:Flyphones@Admin123}}
    bootstrap-admin-name: Flyphones Root Admin
    dev-seed-demo-admins: true
