server:
  port: ${SERVER_PORT:8085}

spring:
  datasource:
    url: jdbc:h2:mem:ivanta;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER,VALUE,STATUS,KEY,TYPE,ORDER,LIMIT
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
      path: /h2-console

ivanta:
  security:
    bootstrap-admin-email: ${IVANTA_INITIAL_ADMIN_EMAIL:${ADMIN_ROOT_EMAIL:admin@ivanta.in}}
    bootstrap-admin-password: ${IVANTA_INITIAL_ADMIN_PASSWORD:${ADMIN_ROOT_PASSWORD:Admin@12345}}
    bootstrap-admin-name: iVanta Root Admin
    dev-seed-demo-admins: ${DEV_SEED_DEMO_ADMINS:true}
